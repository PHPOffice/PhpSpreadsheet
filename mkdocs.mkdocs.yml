site_name: PhpSpreadsheet Documentation
repo_url: https://github.com/PHPOffice/phpspreadsheet
edit_uri: edit/master/docs/

theme:
    name: mkdocs
    color_mode: auto
    user_color_mode_toggle: true
extra_css:
    - extra/extra.css
extra_javascript:
    - extra/extrajs.js
markdown_extensions:
    - md_in_html
